[project]
name = "client-portal"
version = "0.2.0"
description = "Client Portal for real estate companies running Zoho CRM: clients track deals, guests search and match properties, admins see all activity."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "sqlalchemy[asyncio]==2.1.5",
  "aiosqlite==0.22.1",
  "mcp==2.3.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.ai", "app.mcp_zoho", "app.routes", "app.security", "app.zoho"]

[tool.setuptools.package-data]
"app.zoho" = ["sample_data.json"]
