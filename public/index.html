<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Client Portal</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-nav="dashboard">My Deals</a>
        <a href="#/search" data-nav="search">Find a Property</a>
        <a href="#/messages" data-nav="messages">Contact Agent</a>
      </nav>
      <div class="user-menu">
        <span id="user-name"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logout">Sign out</button>
      </div>
    </div>
  </header>
  <div class="demo-banner" id="demo-banner" hidden>Demo mode: showing sample data, not connected to Zoho CRM.</div>
  <main id="app" class="container" tabindex="-1"></main>
</body>
</html>
